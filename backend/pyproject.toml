[project]
name = "tesisstat-backend"
version = "0.1.0"
description = "Shared foundation for TesisStat AI"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "uvicorn>=0.32,<1"]

[dependency-groups]
dev = [
 "pytest>=8,<10",
 "ruff>=0.9,<1",
 "jsonschema>=4.23,<5",
 "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
